name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Build and deploy
    uses: sebastienrousseau/config/.github/workflows/reusable-docs.yml@097fb1a947e0821d19cfe2124c634a6ee3106f0a # main
    permissions:
      contents: read
      pages: write
      id-token: write
