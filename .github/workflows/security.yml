name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  security:
    name: Supply chain
    uses: sebastienrousseau/config/.github/workflows/reusable-security.yml@f62f4df4bdc67b10d86c7c0e00c8515d40345d46 # main (config #39, audit exceptions)
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      node-version: '20'
