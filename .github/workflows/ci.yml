name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Conformance
    uses: sebastienrousseau/config/.github/workflows/reusable-ci.yml@bf63d1689967a0bf169ce9ac40fefc22d4929181 # main
    with:
      node-versions: '["20","22","24"]'
      os: '["ubuntu-latest","macos-latest","windows-latest"]'
      eslint-config: ./index.cjs

  ci-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the ci matrix, so adding or dropping a version never
    # renames a required check.
    name: Conformance (all)
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: test "$RESULT" = success
