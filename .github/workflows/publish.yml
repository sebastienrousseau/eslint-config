name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Release
    uses: sebastienrousseau/config/.github/workflows/reusable-publish.yml@097fb1a947e0821d19cfe2124c634a6ee3106f0a # main
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      node-version: '20'
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
