# Local hooks only: they run the same gates CI runs, so a contributor sees a
# failure before pushing rather than after.
repos:
  - repo: local
    hooks:
      - id: conformance
        name: conformance suite
        entry: npm run test:conformance
        language: system
        pass_filenames: false
      - id: trailing-whitespace
        name: no trailing whitespace
        entry: bash -c 'git diff --cached --check'
        language: system
        pass_filenames: false

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words-list=crate,ser,strat]
