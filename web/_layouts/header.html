<header class="masthead">
  <div class="lu-shell masthead-in">
    <a class="brand" href="{{site_url}}">
      <img class="brand-mark" src="{{site_url}}assets/logo.svg"
           width="28" height="28" alt="" aria-hidden="true" />
      <span class="brand-name">{{name}}</span>
    </a>

    <button
      class="nav-btn"
      type="button"
      id="nav-toggle"
      aria-expanded="false"
      aria-controls="site-nav"

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="nav-list">
        <li><a href="{{site_url}}">Home</a></li>
        <li><a href="{{site_url}}installation/">Installation</a></li>
        <li><a href="{{site_url}}usage/">Usage</a></li>
        <li><a href="{{site_url}}mcp/">MCP</a></li>
        <li><a href="{{site_url}}reference/">Reference</a></li>
      </ul>
    </nav>

    <div class="masthead-tools">
      <button class="mode-btn" type="button" id="mode-toggle">
        <span class="mode-btn-label">Theme</span>
        <span class="mode-btn-state" id="mode-state">System</span>
      </button>
    </div>
  </div>
</header>
